<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game History & Results - EZSN Quiz</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex flex-col justify-between">
  <!-- Header -->
  <header class="w-full px-6 py-4 flex items-center justify-between border-b border-white/10 bg-black/25 backdrop-blur-md">
    <div class="flex items-center gap-4">
      <a href="/" class="text-white/70 hover:text-white transition font-bold flex items-center gap-2 text-sm">
        &larr; Home
      </a>
      <span class="text-white/20">|</span>
      <h1 class="text-xl font-black text-white">Past Game Results</h1>
    </div>
    <div class="flex items-center gap-3">
      <a href="/edit" class="btn-secondary py-2 px-4 text-xs font-bold">Quiz Creator</a>
      <a href="/admin" class="btn-primary py-2 px-4 text-xs font-bold">Admin Portal</a>
    </div>
  </header>

  <!-- Main View -->
  <main class="flex-1 max-w-5xl mx-auto w-full px-4 py-8">
    <div class="mb-6">
      <h2 class="text-2xl font-black text-white">Completed Games</h2>
      <p class="text-white/60 text-sm">History of finished multiplayer sessions saved in SQLite</p>
    </div>

    <!-- Games List -->
    <div id="history-container" class="space-y-4">
      <div class="text-center py-12 text-white/50">Loading history...</div>
    </div>

    <!-- Details Modal -->
    <div id="results-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
      <div class="glass-panel p-6 max-w-3xl w-full max-h-[85vh] flex flex-col justify-between">
        <div class="flex items-center justify-between pb-4 border-b border-white/10">
          <div>
            <h3 id="modal-quiz-title" class="text-xl font-black text-white">Game Standings</h3>
            <p id="modal-game-meta" class="text-xs text-white/60">PIN: ------ &bull; Date</p>
          </div>
          <button id="btn-close-modal" class="text-white/60 hover:text-white font-bold text-lg">✕</button>
        </div>

        <div class="overflow-y-auto py-4 flex-1">
          <table class="w-full text-left text-sm">
            <thead>
              <tr class="text-xs uppercase text-white/50 border-b border-white/10">
                <th class="py-2 px-3">Rank</th>
                <th class="py-2 px-3">Nickname</th>
                <th class="py-2 px-3">Score</th>
                <th class="py-2 px-3">Correct Answers</th>
              </tr>
            </thead>
            <tbody id="modal-results-tbody" class="divide-y divide-white/5">
              <!-- Rows -->
            </tbody>
          </table>
        </div>

        <div class="pt-4 border-t border-white/10 flex justify-end">
          <button id="btn-modal-dismiss" class="btn-secondary py-2 px-6 text-sm font-bold">Close</button>
        </div>
      </div>
    </div>

  </main>

  <script src="/js/common.js"></script>
  <script src="/js/branding.js"></script>
  <script src="/js/history.js"></script>
</body>
</html>
