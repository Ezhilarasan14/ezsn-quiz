<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Creator - EZSN Quiz</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex flex-col justify-between">
  <!-- Header -->
  <header class="w-full px-6 py-4 flex items-center justify-between border-b border-white/10 bg-black/25 backdrop-blur-md">
    <div class="flex items-center gap-4">
      <a href="/" class="text-white/70 hover:text-white transition font-bold flex items-center gap-2 text-sm">
        &larr; Home
      </a>
      <span class="text-white/20">|</span>
      <h1 class="text-xl font-black text-white">Quiz Creator & Manager</h1>
    </div>
    <div class="flex items-center gap-3">
      <button id="btn-new-quiz" class="btn-primary py-2 px-5 text-sm font-bold flex items-center gap-2">
        <span>+ New Quiz</span>
      </button>
    </div>
  </header>

  <!-- Main View -->
  <main class="flex-1 max-w-5xl mx-auto w-full px-4 py-8">
    
    <!-- View 1: Quiz Library List -->
    <div id="view-library" class="space-y-6">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-2xl font-black text-white">Your Quizzes</h2>
          <p class="text-white/60 text-sm">Create, edit, duplicate, or delete quizzes stored in SQLite</p>
        </div>
      </div>

      <div id="library-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="col-span-full text-center py-12 text-white/50">Loading quizzes...</div>
      </div>
    </div>

    <!-- View 2: Quiz Editor Form -->
    <div id="view-editor" class="hidden space-y-6 animate-slide-up">
      <div class="flex items-center justify-between pb-4 border-b border-white/10">
        <div>
          <button id="btn-back-to-library" class="text-sm text-white/60 hover:text-white font-bold mb-1 flex items-center gap-1">
            &larr; Back to Library
          </button>
          <h2 id="editor-page-title" class="text-2xl font-black text-white">Create New Quiz</h2>
        </div>
        <div class="flex items-center gap-3">
          <button id="btn-preview-quiz" class="btn-secondary py-2 px-4 text-sm font-bold">
            Preview
          </button>
          <button id="btn-save-quiz" class="btn-primary py-2 px-6 text-sm font-black shadow-lg">
            Save Quiz
          </button>
        </div>
      </div>

      <!-- Quiz Metadata -->
      <div class="glass-panel p-6 space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-white/70 mb-1">Quiz Title *</label>
          <input type="text" id="quiz-title-input" class="glass-input text-lg font-bold" placeholder="e.g. Science & Space Wonders">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-white/70 mb-1">Description (optional)</label>
          <textarea id="quiz-desc-input" class="glass-input text-sm" rows="2" placeholder="Brief summary of what this quiz covers..."></textarea>
        </div>
      </div>

      <!-- Questions List -->
      <div class="space-y-4">
        <div class="flex items-center justify-between">
          <h3 class="text-xl font-black text-white flex items-center gap-2">
            <span>Questions</span>
            <span id="question-count-badge" class="px-2 py-0.5 rounded-full bg-white/20 text-xs text-amber-300">0</span>
          </h3>
          <button id="btn-add-question" class="btn-secondary py-1.5 px-4 text-xs font-bold flex items-center gap-1">
            <span>+ Add Question</span>
          </button>
        </div>

        <div id="questions-container" class="space-y-6">
          <!-- Rendered questions -->
        </div>
      </div>

      <div class="pt-4 flex justify-end gap-3">
        <button id="btn-save-quiz-bottom" class="btn-primary py-3 px-8 text-base font-black shadow-xl">
          Save Quiz &rarr;
        </button>
      </div>
    </div>

    <!-- Modal: Live Preview -->
    <div id="preview-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
      <div class="glass-panel p-6 max-w-2xl w-full max-h-[85vh] flex flex-col justify-between">
        <div class="flex items-center justify-between pb-4 border-b border-white/10">
          <h3 class="text-xl font-black text-white">Quiz Preview</h3>
          <button id="btn-close-preview" class="text-white/60 hover:text-white font-bold text-lg">✕</button>
        </div>
        <div id="preview-body" class="overflow-y-auto py-4 space-y-4 flex-1">
          <!-- Dynamic Preview Items -->
        </div>
        <div class="pt-4 border-t border-white/10 flex justify-end">
          <button id="btn-modal-close" class="btn-secondary py-2 px-6 text-sm font-bold">Close Preview</button>
        </div>
      </div>
    </div>

  </main>

  <script src="/js/audio.js"></script>
  <script src="/js/confetti.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/editor.js"></script>
</body>
</html>
