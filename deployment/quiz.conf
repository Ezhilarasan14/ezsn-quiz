server {
    listen 80;
    listen [::]:80;
    server_name quiz.ezsnapps.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name quiz.ezsnapps.in;

    # Custom log configuration
    error_log /var/log/nginx/quiz_error.log;
    access_log /var/log/nginx/quiz_access.log;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    ssl_certificate /etc/letsencrypt/live/quiz.ezsnapps.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/quiz.ezsnapps.in/privkey.pem; # managed by Certbot
}
